<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detection Questionnaire</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="logo">
      <span class="droplet">💧</span> BloodType AI
    </div>
    <nav>
      <a href="index.html">Home</a>
      <a href="detection.html">Detection</a>
      <a href="#">Admin</a>
    </nav>
  </header>

  <main>
    <h1>Detection Questionnaire</h1>
    <form id="questionnaire">
      <fieldset>
        <legend>Personal Details</legend>
        <label>Full Name: <input type="text" name="name" required></label>
        <label>Age: <input type="number" name="age" required></label>
        <label>Gender:
          <select name="gender" required>
            <option value="">Select...</option>
            <option>Male</option>
            <option>Female</option>
            <option>Other</option>
          </select>
        </label>
      </fieldset>

      <fieldset>
        <legend>Family History</legend>
        <label>Mother's Blood Type: <input type="text" name="mother" placeholder="e.g. A+, O-"></label>
        <label>Father's Blood Type: <input type="text" name="father" placeholder="e.g. B+, AB+"></label>
        <label>Previous Knowledge? <input type="text" name="knowledge"></label>
        <label>Rh Factor History: <input type="text" name="rh"></label>
      </fieldset>

      <button type="submit" class="btn black">Submit Answers</button>
    </form>

    <div id="result"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
